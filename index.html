<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="hello">Hello</h1>
  <button id="button">change background</button>
  
  <style>
    body {
      background-color:var(--color);
      display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
flex-direction: column;
    }

    #button{
 border-radius: 10px;
      width: 130px;    
height: 50px;
border: 1px solid black;
font-size: medium;
transition: all 0.5s;
background-color: white;
    }
#button:hover {
 
   transform: translateY(-4px);
  
}
    </style>

  <script>
const cbutton = document.getElementById ('button')


cbutton.addEventListener("click", () => {
  if (document.body.style.backgroundColor === "black") {
    document.body.style.backgroundColor = "white";
    document.body.style.color = "black";
    cbutton.style.backgroundColor = "white";
    cbutton.style.color = "black";
    cbutton.style.border = "1px solid black";
  } else {
    document.body.style.backgroundColor = "black";
    document.body.style.color = "white";
    cbutton.style.backgroundColor = "black";
    cbutton.style.color = "white";
    cbutton.style.border = "1px solid white";
  }
});


  </script>
</body>
</html>
