<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>
<body>
  <h1 id="hello">Hello</h1>
  <button id="button">Change Background</button>
  
  <style>
    body {
      font-family: "Archivo Black", sans-serif;
      background-color:var(--color);
      display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
flex-direction: column;
      transition:all 0.5s;
    }

    #button{
      font-family: "Archivo Black", sans-serif;
 border-radius: 10px;
      width: 150px;    
height: 50px;
border: 2px solid black;
font-size: 13px;
transition: all 0.5s;
background-color: white;
letter-spacing: 2px;
    }
#button:hover {
 
   transform: translateY(-4px);
  
}
    </style>

  <script>
const cbutton = document.getElementById ('button')


cbutton.addEventListener("click", () => {
  if (document.body.style.backgroundColor === "black") {
    document.body.style.backgroundColor = "white";
    document.body.style.color = "black";
    cbutton.style.backgroundColor = "white";
    cbutton.style.color = "black";
    cbutton.style.border = "2px solid black";
  } else {
    document.body.style.backgroundColor = "black";
    document.body.style.color = "white";
    cbutton.style.backgroundColor = "black";
    cbutton.style.color = "white";
    cbutton.style.border = "2px solid white";
  }
});


  </script>
</body>
</html>
